<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="og-bg-grad" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="50%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="og-blob-1" x1="800" y1="300" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="og-blob-2" x1="600" y1="450" x2="1100" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1D4ED8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.2" />
    </linearGradient>

    <!-- Card Accents -->
    <linearGradient id="og-card-stem" x1="94" y1="504" x2="94" y2="564" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="og-card-top" x1="110" y1="532" x2="146" y2="506" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="og-card-bottom" x1="113" y1="530" x2="149" y2="562" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <filter id="og-shadow" x="620" y="470" width="490" height="130" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="630" fill="url(#og-bg-grad)" />

  <!-- Subtle grid pattern -->
  <g opacity="0.4">
    <path d="M0 100H1200M0 200H1200M0 300H1200M0 400H1200M0 500H1200" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4 6" />
    <path d="M200 0V630M400 0V630M600 0V630M800 0V630M1000 0V630" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4 6" />
  </g>

  <!-- Decorative Corner Blobs -->
  <path d="M839 606C839 539.726 892.726 486 959 486H1200V630H839V606Z" fill="url(#og-blob-1)" />
  <circle cx="1060" cy="530" r="140" fill="url(#og-blob-2)" />

  <!-- Interactive Form Button Pill (Preview Graphic) -->
  <g filter="url(#og-shadow)">
    <rect x="650" y="490" width="430" height="84" rx="42" fill="white" />
    <text x="690" y="542" fill="#0F172A" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" letter-spacing="-0.01em">Press Enter to continue</text>
    <circle cx="1038" cy="532" r="30" fill="#2563EB" />
    <path d="M1032 522L1042 532L1032 542" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- KyndForm Branding Block (Bottom Left) -->
  <g>
    <!-- Mini Logo Glyph -->
    <rect x="88" y="504" width="12" height="60" rx="6" fill="url(#og-card-stem)" />
    <path d="M107 532L127 514C128.5 512.6 130.8 512.8 132.1 514.4C133.4 516 133.2 518.3 131.6 519.6L113.8 534L132.5 556C133.9 557.6 133.6 560 132 561.3C130.4 562.6 128 562.4 126.7 560.7L107 536Z" fill="url(#og-card-top)" />
    <circle cx="110" cy="534" r="4.5" fill="#93C5FD" />

    <!-- Brand Wordmark -->
    <text x="156" y="542" fill="#0F172A" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="700" letter-spacing="-0.02em">KyndForm</text>
    <text x="157" y="563" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">Conversational &amp; Classic Forms</text>
  </g>
</svg>
